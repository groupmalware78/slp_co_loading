services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freight_forwarder
    ports:
      - "5432:5432"
    volumes:
      - freight_forwarder_pgdata:/var/lib/postgresql/data

volumes:
  freight_forwarder_pgdata:
